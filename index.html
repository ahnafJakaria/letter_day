<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>চিঠি দিবসের ভালোবাসা 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #0a030d;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            color: #ffffff;
            cursor: default;
            user-select: none;
        }

        #bgMusic {
            position: fixed;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .love-rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .rain-drop {
            position: absolute;
            top: -50px;
            pointer-events: none;
            animation: fallRain linear infinite;
            will-change: transform, opacity;
        }
        @keyframes fallRain {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .custom-cursor {
            position: fixed;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.8), transparent 70%);
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
            mix-blend-mode: screen;
            box-shadow: 0 0 20px #ff1493, 0 0 40px #ff007f;
        }
        .custom-cursor::after {
            content: '💖';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            animation: pulseCursor 1.2s infinite alternate;
        }
        @keyframes pulseCursor {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }
        .custom-cursor.hover-state {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.6), rgba(255, 20, 147, 0.4) 60%, transparent 80%);
            box-shadow: 0 0 30px #00f5d4;
        }
        .custom-cursor.hover-state::after {
            content: '✨';
            font-size: 26px;
        }

        .love-trail-item {
            position: fixed;
            pointer-events: none;
            z-index: 999990;
            font-size: 18px;
            text-shadow: 0 0 12px #ff1493, 0 0 25px #ff007f;
            animation: trailFade 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes trailFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -180%) scale(1.6) rotate(25deg);
                opacity: 0;
            }
        }

        .burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999995;
            font-size: 22px;
            animation: burstAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform, opacity;
        }
        @keyframes burstAnim {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot));
                opacity: 0;
            }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem 6rem 1.5rem;
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 2;
            animation: orbMove 18s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 550px;
            height: 550px;
            background: rgba(255, 20, 147, 0.18);
            top: -150px;
            left: -150px;
        }
        .orb-2 {
            width: 650px;
            height: 650px;
            background: rgba(157, 78, 221, 0.15);
            bottom: -200px;
            right: -200px;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 450px;
            height: 450px;
            background: rgba(0, 245, 212, 0.10);
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }
        @keyframes orbMove {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(70px, 80px) scale(1.25);
            }
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
        }
        .header-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.2rem;
            background: linear-gradient(135deg, #ffffff 0%, #ff85c0 30%, #ff1493 60%, #00f5d4 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            animation: titleGradient 5s ease infinite, titleFloat 4s ease-in-out infinite alternate;
        }
        @keyframes titleGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        @keyframes titleFloat {
            0% {
                transform: translateY(0px);
                filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.5));
            }
            100% {
                transform: translateY(-8px);
                filter: drop-shadow(0 0 40px rgba(255, 20, 147, 0.9)) drop-shadow(0 0 20px rgba(0, 245, 212, 0.6));
            }
        }
        .header-subtitle {
            font-size: 1.25rem;
            color: #fce4ec;
            font-weight: 400;
            letter-spacing: 1.2px;
            max-width: 650px;
            margin: 0 auto;
            text-shadow: 0 0 12px rgba(255, 105, 180, 0.7);
            animation: glowTextPulse 3s ease-in-out infinite alternate;
        }
        @keyframes glowTextPulse {
            0% {
                opacity: 0.8;
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 25px rgba(255, 20, 147, 0.9), 0 0 40px rgba(157, 78, 221, 0.7);
            }
        }

        .letter-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            border-radius: 35px;
            padding: 3.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 50px rgba(255, 20, 147,
                    0.25);
            margin-bottom: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .letter-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 105, 180, 0.1), transparent 40%, rgba(0, 245, 212,
                    0.1), transparent 80%);
            animation: rotateGlow 15s linear infinite;
            z-index: -1;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .letter {
            font-size: 1.3rem;
            line-height: 2.1;
            color: #ffffff;
            position: relative;
            z-index: 2;
            min-height: 280px;
            font-weight: 300;
            letter-spacing: 0.6px;
            text-align: justify;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }
        .letter .signature {
            text-align: right;
            margin-top: 2.5rem;
            font-size: 2.2rem;
            color: #ff85c0;
            font-weight: 600;
            font-family: 'Great Vibes', cursive;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.8), 0 0 30px rgba(255, 105, 180, 0.5);
            opacity: 0;
            animation: fadeInSign 2s forwards 0.5s, floatSign 3s ease-in-out infinite alternate 2.5s;
        }
        @keyframes fadeInSign {
            to {
                opacity: 1;
            }
        }
        @keyframes floatSign {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-5px);
            }
        }

        .typed-cursor {
            color: #ff1493;
            font-size: 1.5rem;
            text-shadow: 0 0 15px #ff1493;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            color: #ffb3d9;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 1.1rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            max-width: 440px;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .back-button:hover {
            background: rgba(255, 105, 180, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.3);
            border-color: rgba(255, 105, 180, 0.5);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .custom-cursor {
                display: none;
            }
            body,
            button,
            a {
                cursor: auto !important;
            }
            .main-wrapper {
                padding: 2rem 1rem 5rem 1rem;
            }
            .header-title {
                font-size: 3.2rem;
            }
            .header-subtitle {
                font-size: 1rem;
            }
            .letter-container {
                padding: 2rem 1.5rem;
                border-radius: 25px;
            }
            .letter {
                font-size: 1.08rem;
                line-height: 1.9;
            }
            .back-button {
                font-size: 1rem;
                padding: 0.9rem 2rem;
            }
        }
        @media (max-width: 420px) {
            .header-title {
                font-size: 2.6rem;
            }
            .letter-container {
                padding: 1.5rem 1.2rem;
            }
            .letter {
                font-size: 1rem;
                line-height: 1.8;
            }
            .back-button {
                font-size: 0.9rem;
                padding: 0.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="atf.mp3" type="audio/mpeg">
    </audio>

    <div class="custom-cursor" id="customCursor"></div>

    <canvas id="bgCanvas"></canvas>

    <div class="love-rain-container" id="loveRain"></div>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="main-wrapper">

        <header>
            <h1 class="header-title">💌 চিঠি দিবসের চিঠি 💌</h1>
            <p class="header-subtitle">প্রিয় নিমফুল, আজ ১লা সেপ্টেম্বর — চিঠি দিবসে.... ✨</p> 
        </header> 

        <div class="letter-container">
            <div class="letter" id="typed-text"></div>
        </div>

        <div class="button-container">
            <a href="#" class="back-button" id="backBtn">
                <i class="fas fa-heart"></i> হৃদয়ে রাখা চিঠি
            </a>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js">
    </script>

    <script>
        // ============================================================
        // PERSISTENT MUSIC
        // ============================================================
        const bgMusic = document.getElementById('bgMusic');
        const savedTime = localStorage.getItem('musicTime');
        if (savedTime) {
            bgMusic.currentTime = parseFloat(savedTime);
        }
        bgMusic.ontimeupdate = () => {
            localStorage.setItem('musicTime', bgMusic.currentTime);
        };

        function startMusic() {
            bgMusic.play().then(() => {
                document.removeEventListener('click', startMusic);
                document.removeEventListener('touchstart', startMusic);
                document.removeEventListener('keydown', startMusic);
            }).catch(e => console.log('Waiting for interaction.'));
        }
        document.addEventListener('click', startMusic);
        document.addEventListener('touchstart', startMusic);
        document.addEventListener('keydown', startMusic);
        window.addEventListener('load', () => {
            setTimeout(() => {
                bgMusic.play().catch(() => {});
            }, 300);
        });
        document.addEventListener('click', () => {
            bgMusic.play().catch(() => {});
        });
        document.addEventListener('touchstart', () => {
            bgMusic.play().catch(() => {});
        });

        // ============================================================
        // CANVAS BACKGROUND
        // ============================================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = window.innerWidth < 768 ? 45 : 90;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2.5 + 1;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = ['#ff1493', '#ff6b9d', '#9d4edd', '#00f5d4'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = (1 - dist / 110) * 0.25;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ============================================================
        // LOVE RAIN
        // ============================================================
        const rainContainer = document.getElementById('loveRain');
        const rainItems = ['❤️', '💖', '💗', '🌸', '✨', '🌺', '🌟', '💓'];

        function createRainDrop() {
            const drop = document.createElement('div');
            drop.className = 'rain-drop';
            drop.innerHTML = rainItems[Math.floor(Math.random() * rainItems.length)];
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.fontSize = (Math.random() * 16 + 12) + 'px';
            drop.style.textShadow = `0 0 10px rgba(255, 20, 147, 0.8)`;
            rainContainer.appendChild(drop);
            setTimeout(() => drop.remove(), 10000);
        }
        setInterval(createRainDrop, 350);

        // ============================================================
        // CUSTOM CURSOR
        // ============================================================
        const customCursor = document.getElementById('customCursor');
        const heartsList = ['💖', '❤️', '🌸', '✨', '💗'];
        let lastTrailTime = 0;

        function spawnLoveTrail(x, y) {
            const now = Date.now();
            if (now - lastTrailTime < 35) return;
            lastTrailTime = now;

            const trail = document.createElement('div');
            trail.className = 'love-trail-item';
            trail.innerHTML = heartsList[Math.floor(Math.random() * heartsList.length)];
            trail.style.left = x + 'px';
            trail.style.top = y + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 900);
        }

        function triggerBurst(x, y) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle';
                particle.innerHTML = heartsList[Math.floor(Math.random() * heartsList.length)];

                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 90;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 360) + 'deg';

                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--rot', rot);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
            spawnLoveTrail(e.clientX, e.clientY);

            if (e.target.closest('button') || e.target.closest('a')) {
                customCursor.classList.add('hover-state');
            } else {
                customCursor.classList.remove('hover-state');
            }
        });

        document.addEventListener('click', (e) => {
            triggerBurst(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            spawnLoveTrail(touch.clientX, touch.clientY);
        }, { passive: true });

        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            triggerBurst(touch.clientX, touch.clientY);
        }, { passive: true });

        // ============================================================
        // TYPED LETTER — চিঠি দিবসের চিঠি (শুধু এই চিঠি)
        // ============================================================
        const letterContent = `প্রিয় নিমফুল,<br><br>
আজ ১লা সেপ্টেম্বর। চিঠি দিবস, তাই ভাবলাম আপনাকে একটা চিঠি লিখি।<br><br>
আপনাকে আমি রবীন্দ্রনাথের বিমালা, লাবণ্য, নন্দিনী, মৃন্ময়ী, চারুচলতা ডাকবো, নাকি হুমায়ুন এর কলমের রুপা, নিলু, মুনা, নিড়া ডাকবো তা ভেবে পাই না। (কারণ আপনি একটা মাদারবোর্ড)<br><br>
আপনার ঐ দুরন্ত আর প্রাণবন্ত মুখখানি আমাকে সবসময় উজ্জ্বল কৃষ্ণচূড়া আর সোনালী অমলতাসের কথা মনে করিয়ে দেয়। যা যেকোনো নিস্তেজ দিনকেও মুহূর্তের মধ্যে উৎসবে রূপ দিতে পারে।<br><br>
আবার কোনো রকম অভিযোগ ছাড়াই জীবনের সব পরিস্থিতিতে হাসিমুখে পাশে থাকার নাম ঐ নয়নতারা আর অলকানন্দার মতই আপনার অবয়ব। (একদম ডাহা মিছা কথা)<br><br>
আমাদের সম্পর্কে একধরনের নিখাদ আভিজাত্য আছে। ঠিক কাঠগোলাপের শুভ্রতার মতো, তেমনি বাস্তবতার ভিড়ে হুট করে ফেলা আসা দিনগুলোর কথা মনে পড়াটা কিন্তু ভোরের শিউলি ফুলের আকুল করা সুবাসের মতোই স্নিগ্ধ। (সম্পর্কের স ও নাই)<br><br>
অবশেষে আপনাকে বলি,<br>
আপনাকে পাওয়ার ইচ্ছে আমার কখনোই কমবে না। বরং প্রতিদিন একটু একটু করে বেড়ে যায়। দূরাত্ব বাড়ে, সময় পাল্টায়, মানুষ বদলায়, -কিন্তু আপনার জন্য আমার অপেক্ষাটা একই জায়গা থেমে থাকে। হয়তো আপনি জানেন না, কতটা চুপচাপ আপনাকে চাই আমি। আমি প্রকাশ করি না সবটা, তবুও মনটা প্রতিদিন বলে, কবে আপনাকে নিজের করে পাবো, আর আপনার জন্য....!<br><br>
আমার অনুভুতি কখনোই পরিবর্তন হবে না। (একদম ডাহা ফ্লার্টিং মারলাম 👀🤧)<br><br>
